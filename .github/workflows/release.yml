name: release

# Publishes the package to npm when a GitHub Release is published, and nothing
# else. Tagging alone does not publish: a release is a deliberate act, and this
# workflow is deliberately not the trigger for a pre-release rehearsal.
#
# ── Why trusted publishing (OIDC) and not a token ─────────────────────────────
#
# npm's trusted publishing lets this workflow authenticate with a short-lived
# OIDC token minted by GitHub, so there is no long-lived npm credential in the
# repository or in Actions secrets. With `--provenance`, npm also publishes a
# signed attestation linking the tarball to this commit and this workflow, which
# is what lets an installer verify that the code they got is the code CI tested.
#
# ── One-time setup this workflow cannot do for you ────────────────────────────
#
# Trusted publishing requires the package to EXIST on the registry first: there
# is nothing to attach a trusted publisher to until then. So the first version is
# published from a maintainer machine:
#
#   1. npm login                       # 2FA required
#   2. npm publish --access public     # publishes 0.2.0
#   3. On npmjs.com → Packages → <this package> → Settings → Trusted publishing →
#      Add trusted publisher → GitHub Actions:
#        Organization or user: 141w
#        Repository:           dsh-quorum
#        Workflow filename:    release.yml      # filename only, no path, with .yml
#        Environment:          (blank, unless you add one below)
#
#   After step 3 every later release goes through this workflow. To rehearse the
#   whole path without publishing, run the workflow manually with
#   `dry_run: true`.
#
#   Two constraints on step 3 that cost a debugging cycle each: a connection's
#   fields CANNOT be edited afterwards (wrong value → delete it and add a new one),
#   and a brand-new connection EXPIRES unless its first successful publish lands
#   within 2 days. So configure and release in one sitting.
#
#   And the one that mattered: trusted publishing needs npm CLI >= 11.5.1 on the
#   runner. See "Install an npm that can authenticate via OIDC" below — with the
#   Node 22 default (npm 10.9.x) the provenance statement still signs, the publish
#   still 404s, and nothing in the output says why.
#
#   Done: step 1-3 for 0.3.1 on 2026-10-08 (docs/verification.md D14). It was published
#   from a maintainer machine and therefore carries no provenance attestation, and it
#   deliberately has NO GitHub Release: this workflow fires on the `released` event and
#   `0.3.1` already exists on the registry, so creating that release now would only
#   produce an E409. The first CI-published version is 0.3.3, not 0.3.2 — v0.3.2's two
#   attempts failed on the CLI version note above, and a re-run cannot fix a tag whose
#   workflow file predates the fix (docs/verification.md D18).
#
# ── Keeping the attestation honest ────────────────────────────────────────────
#
# `repository.url` in package.json must keep matching this repository. If it
# drifts, provenance cannot be verified against the source and the attestation is
# worse than useless.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Rehearse the full path without publishing'
        type: boolean
        default: true

permissions:
  contents: read
  # Required to mint the OIDC token npm's trusted publishing exchanges.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      DSH_VERSION: '0.2.0-rc.2'
      npm_config_cache: ${{ github.workspace }}/.npm-cache
      # Pinned, not `latest`: the CLI version decides whether the OIDC exchange
      # happens at all, and 12.2.0 is what the maintainer machine publishes with,
      # so CI and a manual emergency publish produce byte-comparable notices.
      NPM_VERSION: '12.2.0'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          # Points npm at the public registry explicitly; a stale .npmrc cannot
          # silently redirect a publish.
          registry-url: 'https://registry.npmjs.org'

      - name: Install an npm that can authenticate via OIDC
        # This is the step that was missing, and it failed silently. Node 22 ships
        # npm 10.9.x, and npm's own requirement for trusted publishing is CLI >=
        # 11.5.1: older clients can still sign a provenance statement (that part
        # talks to sigstore, not to the registry), but they never exchange the OIDC
        # token for a registry credential. The publish then goes out unauthenticated
        # and the registry answers the anonymous PUT with a bare `E404 Not Found` —
        # which reads exactly like "this package has no trusted publisher", and for
        # two runs that is what we believed. Pin the CLI, and assert the pin landed.
        run: |
          set -eu
          npm install --global "npm@${NPM_VERSION}"
          got="$(npm --version)"
          if [ "$got" != "$NPM_VERSION" ]; then
            echo "expected npm ${NPM_VERSION}, got ${got}" >&2
            exit 1
          fi
          echo "publishing with npm ${got}; trusted publishing requires >= 11.5.1"

      - name: Install pnpm
        run: npm install --global pnpm@9

      - name: Refuse to publish an unverified tree
        # The release must be the artifact CI gated. Re-running the full suite
        # here is cheap next to publishing something that skipped it.
        run: |
          npm run build
          npm test
          npx --yes --package=@deepseek-ai/dsh@${DSH_VERSION} -- npm run smoke

      - name: Guard the tag
        if: github.event_name == 'release'
        # A release whose tag disagrees with package.json version publishes the
        # wrong number, and npm makes that permanent within minutes.
        run: |
          set -eu
          tag='${{ github.event.release.tag_name }}'
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "release tag $tag does not match package.json version $pkg" >&2
            exit 1
          fi

      - name: Publish (rehearsal)
        if: github.event_name == 'workflow_dispatch'
        run: npm publish --dry-run --access public

      - name: Publish
        if: github.event_name == 'release'
        # No NODE_AUTH_TOKEN: npm exchanges the OIDC token for a short-lived
        # credential. `--provenance` attaches the signed build attestation.
        run: npm publish --access public --provenance
