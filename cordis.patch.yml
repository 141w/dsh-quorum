- insert:
    - id: quorum
      name: dsh-quorum
      config:
        # A teammate's role is resolved from its durable Team name, so a role card
        # binds to identity rather than to whatever the prompt happens to say.
        # `lead` is the reserved key for the Team Lead itself.
        roles:
          lead:
            shape: ship
            writeScopes: []
            # Budget enforcement bites the Lead, because only the Lead can spawn.
            maxMembers: 4
          reviewer:
            shape: scout
            allow: [read, read_image, grep, glob, list]
          fixer:
            shape: ship
            writeScopes: ["src/", "tests/"]
        # Unlisted teammates get this card. `scout` by default: a role nobody
        # declared is not implicitly trusted to modify the checkout.
        defaultRole:
          shape: scout
          allow: [read, read_image, grep, glob, list]
        budget:
          # Billed口径: input + output + cacheRead + cacheWrite — the disjoint sum
          # the runtime defines (dsh-llm token-usage contract; measured on 449 real
          # calls in docs/M1-usage-accounting.md, where it equals totalTokens on
          # every sample). The earlier `input + output` reading is low by 96.9%.
          #
          # Recalibrated against measurement, not taste: the 2026-10-03 real team
          # round (1 Lead + 2 members, 69 assistant messages) billed 1,359,602
          # tokens under this formula — Lead 759,983, members 341,749 + 257,870.
          # That is 68% of this budget, so one solid round fits and a second, or a
          # larger team, crosses the soft tier. Lower it deliberately, per
          # workspace. (The former 400,000 default was set under the old
          # `input + output` formula, whose figure for this same round was 448,173 —
          # a number small enough that the tiers could never be reached in
          # practice, which is part of why they went untested.)
          maxBilledTokens: 2000000
          # Crossing the soft tier stops new members; crossing the hard tier also
          # stops writes, forcing the team toward a conclusion.
          softTier: 0.7
          hardTier: 0.9
        quorum:
          # What `quorum_wait` blocks on. `requires` is the number of teammate
          # submissions that must have reached the Lead before it reports the
          # discussion as converged; anything that is not an integer means
          # "every teammate rostered today, one delivered message each".
          requires: all
          # Default deadline for one call, and how long a single wake may sleep
          # before the mailbox state is re-read. `pollMs` stays >= 10000 because
          # upstream's change-wait rejects anything shorter.
          timeoutMs: 300000
          pollMs: 30000
        transition:
          # The scout -> ship switch. While this is true — the default — EVERY role in
          # the team, the Lead included, is refused file writes until `quorum_wait`
          # reports the quorum met: each required teammate has delivered a message to the
          # Lead AND its own session log shows a successful non-protocol tool result
          # before that report. Gating only the members would be no gate at all, since
          # the `lead` card above carries `writeScopes: []` (unrestricted) and could
          # simply write the file itself.
          #
          # There is deliberately no `waiver` key and no evidence knob here: a gate the
          # Lead can waive mid-round, or that an unevidenced report can satisfy, is the
          # prompt convention this bundle replaces. An unknown key under `transition`
          # is refused at activation rather than ignored. Set this to false only to run
          # a comparison round, and say so in the report.
          gateWritesOnQuorum: true
        debug:
          # One line per exempt session at boot. It is the only way to tell
          # "plain session skipped on purpose" from "the hook never ran", but it
          # would print for every ordinary session, so it stays opt-in.
          logExemption: false
